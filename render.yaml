services:
  - type: web
    name: akikosushi
    runtime: node
    plan: free
    buildCommand: npm install && npm run seed
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: DB_PATH
        value: /data/akiko.db
    disk:
      name: akikosushi-data
      mountPath: /data
      sizeGB: 1
